name: CI

# One job per platform. Each builds Jolt and the C API for its own target once, then runs the tests on it.
#
# Path-filtered: the `changes` job maps the changed files to platforms (jvm / web / ios / android)
# and only those jobs run; docs-only changes run nothing but `ci-gate`, which still reports, so a PR
# is never stuck without a status. Unrecognized paths run everything. External (fork) PRs are held
# until a maintainer clicks "Approve and run" (Settings → Actions → General). `workflow_dispatch`
# runs one platform, or all of them, from the Actions tab.
#
# Pushes to main run the same filtered jobs. Besides post-merge signal, that is what makes caches
# work: a PR can only restore caches saved by its own ref or by main, so main has to save them.
#
# `ci-gate` is the single required status check: on PRs it fails unless every selected job succeeded.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      jobs:
        description: 'Which platform job(s) to run'
        type: choice
        default: all
        options: [all, jvm, web, ios, android]

# Cancel superseded runs for the same ref (a new push to a PR supersedes the old one).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      jvm: ${{ steps.filter.outputs.jvm }}
      web: ${{ steps.filter.outputs.web }}
      ios: ${{ steps.filter.outputs.ios }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with: { sparse-checkout: .github/scripts }
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          ONLY: ${{ inputs.jobs }}
        run: .github/scripts/ci-changes.sh >> "$GITHUB_OUTPUT"

  jvm:
    needs: changes
    if: needs.changes.outputs.jvm == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-latest
            target: windows-x64
          - os: windows-11-arm
            target: windows-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: actions/setup-java@v6
        # Temurin ships no Windows ARM64 JDK 17; Microsoft's build does.
        with: { java-version: '17', distribution: "${{ matrix.target == 'windows-arm64' && 'microsoft' || 'temurin' }}" }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Install CMake + Ninja (Linux)
        if: runner.os == 'Linux'
        # ports.ubuntu.com (the ARM runners' only mirror) intermittently drops
        # connections: refresh the lists and retry before giving up.
        run: |
          for i in 1 2 3; do
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build && exit 0
            echo "apt attempt $i failed; retrying in 20s" && sleep 20
          done
          exit 1
      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      # The generator on its fixture, and what's committed against what it writes now. Once, on the host
      # the committed code was generated on: both read clang's AST.
      - name: Check the generator
        if: matrix.target == 'macos-arm64'
        run: |
          ./gradlew -p build-logic test
          ./gradlew apiCheck
      - name: Build library
        shell: bash
        run: ./gradlew :desktop:cmakeBuild :kotlin:kolt:compileKotlinJvm
      # The loader's own tests, then Jolt through libkolt, loaded as an app loads it: out of the runtime jar.
      - name: Run JVM tests
        shell: bash
        run: ./gradlew :desktop:test :kotlin:kolt:jvmTest
      - name: Check libkolt needs no C++ runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          ! readelf -d desktop/build/kolt-c/*/libkolt.so | grep -E 'NEEDED.*(libstdc\+\+|libc\+\+|libgcc_s)'
      # Coverage once, on the macOS runner. Report-only (non-blocking): no threshold is enforced. The
      # other targets run the same tests on runtimes Kover can't instrument.
      - name: Coverage report
        if: matrix.target == 'macos-arm64'
        run: ./gradlew :kotlin:kolt:koverXmlReportJvm :kotlin:kolt:koverHtmlReportJvm
      - name: Upload coverage report
        if: matrix.target == 'macos-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: kover-coverage
          path: kotlin/kolt/build/reports/kover/
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-test-reports-${{ matrix.target }}
          path: |
            kotlin/*/build/reports/tests/
            desktop/build/reports/tests/
            build-logic/build/reports/tests/

  # The Emscripten half of the web targets, done once: builds kolt.{js,wasm} and hands them to the
  # js and wasm jobs as an artifact.
  web-runtime:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: actions/setup-java@v6
        with: { java-version: '17', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - uses: ./.github/actions/setup-emsdk
      - name: Build wasm runtime
        run: ./gradlew :kotlin:kolt:cmakeBuild_wasm
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-runtime
          path: |
            kotlin/kolt/build/koltWasm/kolt.js
            kotlin/kolt/build/koltWasm/kolt.wasm
          if-no-files-found: error
          retention-days: 1

  js:
    needs: web-runtime
    runs-on: ubuntu-latest
    env:
      KOLT_WASM_PREBUILT: ${{ github.workspace }}/wasm-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '17', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - uses: actions/download-artifact@v8
        with: { name: wasm-runtime, path: wasm-runtime }
      - name: Build library
        run: ./gradlew :kotlin:kolt:compileKotlinJs
      - name: Run JS tests
        run: ./gradlew :kotlin:kolt:jsBrowserTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: js-test-reports
          path: kotlin/*/build/reports/tests/

  # wasmJs shares the webMain actuals with js but runs a different compiler backend and
  # browser runtime, so it gets its own job (distinct signal, runs in parallel with js).
  wasm:
    needs: web-runtime
    runs-on: ubuntu-latest
    env:
      KOLT_WASM_PREBUILT: ${{ github.workspace }}/wasm-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { java-version: '17', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - uses: actions/download-artifact@v8
        with: { name: wasm-runtime, path: wasm-runtime }
      - name: Build library
        run: ./gradlew :kotlin:kolt:compileKotlinWasmJs
      - name: Run Wasm tests
        run: ./gradlew :kotlin:kolt:wasmJsBrowserTest
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-reports
          path: kotlin/*/build/reports/tests/

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: actions/setup-java@v6
        with: { java-version: '17', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - run: brew install ninja
      - name: Build library
        run: ./gradlew :kotlin:kolt:compileKotlinIosArm64 :kotlin:kolt:compileKotlinIosSimulatorArm64
      # In whichever iPhone the runner's Xcode has: Kotlin/Native's default may not be among them.
      - name: Run iOS simulator tests
        run: |
          DEV="$(xcrun simctl list devices available | grep -oE 'iPhone[^(]*' | head -1 | sed 's/ *$//')"
          echo "Simulator: $DEV"
          ./gradlew :kotlin:kolt:iosSimulatorArm64Test "-PiosSimulatorDevice=$DEV"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-reports
          path: kotlin/*/build/reports/tests/

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { submodules: true }
      - uses: actions/setup-java@v6
        with: { java-version: '17', distribution: 'temurin' }
      - uses: ./.github/actions/setup-gradle-cached
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
      # The NDK and CMake kotlin/kolt/build.gradle.kts pins; its CMake tasks don't fetch them.
      - name: Install NDK + CMake
        run: $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null
      - name: Build library
        run: ./gradlew :kotlin:kolt:assemble
      - name: Enable KVM (for android emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Cache the AVD + a warmed boot snapshot so the test run boots from a snapshot instead of
      # cold-booting every time. 2+ GB with a fixed key: only main saves it, PRs restore main's copy.
      - name: AVD cache
        uses: actions/cache/restore@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64
      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-load
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - if: steps.avd-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ steps.avd-cache.outputs.cache-primary-key }}
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -v threadtime > logcat.txt &
            ./gradlew :kotlin:kolt:connectedAndroidDeviceTest
      # An emulator that dies takes its own output with it; the kernel log says whether it was killed.
      - name: Emulator post-mortem
        if: failure()
        run: sudo dmesg | grep -iE 'out of memory|oom|killed process|segfault|qemu' | tail -40 || true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            kotlin/*/build/reports/androidTests/
            logcat.txt

  # Single required status check for branch protection. Jobs the path filter skipped count as
  # passing; a failed or cancelled job (or a failed filter) fails it.
  ci-gate:
    if: always()
    needs: [changes, jvm, web-runtime, js, wasm, ios, android]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Results = ${{ join(needs.*.result, ' ') }}"
      - if: >-
          needs.changes.result != 'success' ||
          contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
